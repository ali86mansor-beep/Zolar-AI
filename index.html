
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zolar AI</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #10101d;
  color: white;
}
header {
  background: #19192b;
  padding: 20px;
  text-align: center;
  border-bottom: 1px solid #393954;
}
.logo {
  font-size: 30px;
  font-weight: bold;
  color: #a78bfa;
}
header p { color: #aaa; }
.container {
  max-width: 750px;
  margin: auto;
  padding: 18px;
}
.welcome {
  text-align: center;
  margin-top: 35px;
}
.welcome h2 { color: #c4b5fd; }
.welcome p { color: #aaa; line-height: 1.8; }
.chat {
  margin-top: 25px;
  padding-bottom: 100px;
}
.message {
  padding: 14px;
  border-radius: 15px;
  margin: 12px 0;
  line-height: 1.8;
  max-width: 90%;
  overflow-wrap: anywhere;
}
.bot {
  background: #24243b;
  border: 1px solid #51447a;
  margin-left: auto;
}
.user {
  background: #6741c7;
  margin-right: auto;
}
.input-area {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: #19192b;
  padding: 15px;
  display: flex;
  gap: 10px;
  border-top: 1px solid #393954;
}
input {
  flex: 1;
  min-width: 0;
  padding: 15px;
  border-radius: 12px;
  border: 1px solid #51447a;
  background: #25253b;
  color: white;
  outline: none;
  font-size: 16px;
}
button {
  background: #8959e8;
  color: white;
  border: none;
  padding: 12px 20px;
  border-radius: 12px;
  font-size: 16px;
  cursor: pointer;
}
.footer {
  text-align: center;
  color: #777;
  font-size: 12px;
  padding: 15px;
}
</style>
</head>
<body>
<header>
  <div class="logo">✦ Zolar AI</div>
  <p>مساعدك الذكي في كل وقت</p>
</header>

<div class="container">
  <div class="welcome">
    <h2>مرحباً بك في Zolar AI 🚀</h2>
    <p>أنا مساعدك الذكي الجديد. اسألني أي سؤال وسأحاول مساعدتك.</p>
  </div>

  <div class="chat" id="chat">
    <div class="message bot">
      أهلاً بك! 👋 أنا Zolar AI، كيف يمكنني مساعدتك اليوم؟
    </div>
  </div>
</div>

<div class="input-area">
  <input id="userInput" type="text"
    placeholder="اكتب رسالتك هنا..." autocomplete="off">
  <button onclick="sendMessage()">إرسال</button>
</div>

<script>
function sendMessage() {
  const input = document.getElementById("userInput");
  const chat = document.getElementById("chat");
  const text = input.value.trim();

  if (!text) return;

  const userMessage = document.createElement("div");
  userMessage.className = "message user";
  userMessage.textContent = text;
  chat.appendChild(userMessage);

  input.value = "";

  const botMessage = document.createElement("div");
  botMessage.className = "message bot";
  botMessage.textContent =
    "وصلني سؤالك! ❤️ أنا نسخة تجريبية. لربطي بذكاء اصطناعي حقيقي نحتاج إضافة API.";
  chat.appendChild(botMessage);

  window.scrollTo({
    top: document.body.scrollHeight,
    behavior: "smooth"
  });
}

document.getElementById("userInput")
.addEventListener("keydown", function(event) {
  if (event.key === "Enter") sendMessage();
});
</script>

<div class="footer">
© 2026 Zolar AI - جميع الحقوق محفوظة
</div>
</body>
</html>
