<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zolar AI</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #10101d;
  color: white;
}
header {
  background: #19192b;
  padding: 20px;
  text-align: center;
  border-bottom: 1px solid #393952;
}
header h1 { color: #a78bfa; margin: 0; }
header p { color: #aaa; }
.container { max-width: 700px; margin: auto; padding: 20px; }
.welcome { text-align: center; margin-top: 55px; }
.welcome h2 { color: #a78bfa; }
#chat { margin-top: 25px; padding-bottom: 100px; }
.message {
  padding: 14px;
  margin: 12px 0;
  border-radius: 14px;
  line-height: 1.7;
  white-space: pre-wrap;
}
.user { background: #5141a8; margin-right: 35px; }
.bot { background: #25253b; margin-left: 35px; }
.input-area {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 15px;
  background: #19192b;
  display: flex;
  gap: 10px;
}
input {
  flex: 1;
  padding: 15px;
  border: 1px solid #555;
  border-radius: 12px;
  background: #25253b;
  color: white;
  outline: none;
}
button {
  border: none;
  padding: 14px 20px;
  border-radius: 12px;
  background: #8b5cf6;
  color: white;
  font-weight: bold;
}
</style>
</head>
<body>
<header>
<h1>✦ Zolar AI</h1>
<p>مساعدك الذكي في كل وقت</p>
</header>
<div class="container">
<div class="welcome" id="welcome">
<h2>أهلاً بك في Zolar AI</h2>
<p>كيف يمكنني مساعدتك اليوم؟</p>
</div>
<div id="chat"></div>
</div>
<div class="input-area">
<input id="question" placeholder="اكتب سؤالك هنا..." onkeydown="if(event.key==='Enter') sendMessage()">
<button onclick="sendMessage()">إرسال</button>
</div>
<script>
function sendMessage() {
const input = document.getElementById("question");
const chat = document.getElementById("chat");
const welcome = document.getElementById("welcome");
const question = input.value.trim();
if (!question) return;
welcome.style.display = "none";
const userMessage = document.createElement("div");
userMessage.className = "message user";
userMessage.textContent = question;
chat.appendChild(userMessage);
const botMessage = document.createElement("div");
botMessage.className = "message bot";
botMessage.textContent = "مرحباً بك في Zolar AI! هذه نسخة تجريبية من الواجهة. لربط الذكاء الاصطناعي الحقيقي نحتاج إلى إعداد API.";
chat.appendChild(botMessage);
input.value = "";
window.scrollTo(0, document.body.scrollHeight);
}
</script>
</body>
</html>
